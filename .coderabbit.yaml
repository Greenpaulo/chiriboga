# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'en-GB'
tone_instructions: 'Be direct and evidence-led. Prioritise correctness over style; do not report speculative or pre-existing issues.'

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  # Keep the ticket text in the PR description untouched. CodeRabbit's
  # walkthrough and inline comments are the review record.
  high_level_summary: false
  review_details: true
  enable_prompt_for_ai_agents: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - '!**/node_modules/**'
    - '!**/package-lock.json'
    - '!**/dist/**'
    - '!**/build/**'

  path_instructions:
    - path: '**/*'
      instructions: |
        Review ticket PRs as an independent maintainer. Treat
        `.agents/skills/review-ticket/SKILL.md` as the authoritative rubric and
        `AGENTS.md` as repository policy.

        The PR description should contain the complete ticket (diagnosis,
        implementation plan when present, acceptance criteria, and Resolution)
        plus the pasted output of `node scripts/ticket.js check <ticket>`. Read
        all of it before reviewing the diff. If the ticket or check output is
        missing, say that the review is incomplete. Treat every unexplained
        changed file, acceptance criterion ticked without supporting evidence,
        or FAIL from `ticket.js check` as Blocking unless the Resolution gives
        valid evidence that the failure is pre-existing and unrelated. Assess
        unticked criteria under the review skill rather than rejecting them
        automatically: a pending F4 gate is permitted when the implementation
        passes review and its option defaults off, but missing required
        implementation or test work remains Blocking.

        Independently verify the claimed root cause and Resolution against the
        current code, tests, game rules, related mechanics, hooks, callers, and
        consumers. Do not trust checked boxes or the Resolution without checking
        the diff. Look for counterexamples involving other board states, other
        callers, asynchronous or continuation ordering, run versus out-of-run
        context, and state restoration after hypothetical evaluation.

        Enforce these principles:
        - no card-title checks in engine or AI logic;
        - no AI access to hidden information, including R&D/Stack order;
        - no constants tuned to one board state;
        - no unrelated refactors or behaviour changes;
        - new AI hooks belong at the bottom of card objects and must be documented
          in `documentation/ai.md`;
        - AI behaviour changes must agree with `documentation/ai-principles.md`,
          the relevant side's `principles.md`, and its `architecture.md`.

        For gated AI tickets, verify the option-off path is unchanged, every
        changed decision path reads the option, and the option defaults off until
        the gate passes. If a gate claims to have passed, require the exact F4
        command, paired seeds and committed deck pairs, all named metrics against
        the committed baseline, and satisfaction of every stated threshold.

        Report only findings introduced by this PR and support each with a file,
        function or line, concrete evidence or counterexample, and the required
        change. Classify findings as Blocking, Should fix, or Note. Blocking and
        Should fix are actionable and require changes; Notes do not. Do not make
        code changes as part of review.

    - path: 'sets/*.js'
      instructions: |
        For every changed card object, compare the implementation with the card
        text and analogous cards. Verify costs, restrictions, timing, choices,
        prevention, cleanup, and once-per-window state. Place AI hooks with the
        existing AI hooks at the bottom of the object and require matching
        documentation in `documentation/ai.md`.

    - path: 'ai_*.js'
      instructions: |
        Check all callers and decision paths, not only the reproduced board.
        Verify hidden information is not read and every hypothetical mutation is
        restored, including on early returns and asynchronous continuations.

    - path: 'runcalculator.js'
      instructions: |
        Check run and out-of-run contexts, encounter and subroutine ordering,
        hypothetical state restoration, and callers on both Corp and Runner AI.

    - path: 'tests/**'
      instructions: |
        Verify tests assert the behaviour claimed by the Resolution and would fail
        without the fix. For bug tickets, the original reproduction must move from
        `tests/pending/` or `tests/fixtures/corp-decisions-pending/` into the green
        suite with its expectation unchanged. Flag weakened, deleted, tautological,
        or implementation-coupled assertions.

    - path: 'documentation/**'
      instructions: |
        Verify the ticket Resolution accurately describes the diff and test
        evidence. For AI changes, require `architecture.md` to describe the new
        behaviour; stale architecture documentation is a Should fix finding.

  pre_merge_checks:
    custom_checks:
      - name: 'Ticket review evidence'
        mode: 'error'
        instructions: |
          Determine whether this is a Chiriboga ticket PR from changed files under
          `documentation/bugs/` or `documentation/backlog/`, or from a linked
          ticket. Do not infer that it is not a ticket PR merely because the PR
          description omits the ticket. Otherwise pass.

          Fail if a ticket PR's description does not include the complete ticket
          body, including its diagnosis/current behaviour, applicable
          implementation plan, acceptance criteria, and final Resolution. Also
          fail if it omits the pasted output of
          `node scripts/ticket.js check <ticket>`, or if that output contains an
          unexplained FAIL, a changed reproduction expectation, or a failing
          required test, or if a ticked acceptance criterion lacks supporting
          evidence. Assess unticked criteria under
          `.agents/skills/review-ticket/SKILL.md`; do not fail solely because a
          criterion is unticked. In particular, a pending F4 gate is permitted
          when the reviewed implementation's option defaults off, while missing
          required implementation or test work still fails the check. A failure
          is acceptable only when the Resolution provides concrete evidence that
          it is pre-existing and unrelated to this PR. Do not claim to execute
          repository tests: assess the recorded output and visible CI.

chat:
  auto_reply: true
